# git-cliff: the list of the commits since the last tag, for the body of a
# release (.github/workflows/release.yml, job notes). Each commit is kept. A
# subject is cut to 200 characters, because GitHub refuses a release body of
# more than 125,000 characters.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | truncate(length=200) }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
# A name after `@` becomes code, so that a release notifies nobody; an issue
# named as #N links to it.
postprocessors = [
  { pattern = '(?m)(^|[^A-Za-z0-9_`])@([A-Za-z0-9][A-Za-z0-9-]*)', replace = "${1}`@${2}`" },
  { pattern = '#([0-9]+)', replace = "[#${1}](https://github.com/PodUtils/podnet/issues/${1})" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
# The subjects are "area: text" (docs/maintenance.md). The group is the
# area. The first parser that matches wins.
commit_parsers = [
  { message = '^Version\b', skip = true },
  { message = '^(warp|vnet|pod)\b', group = "<!-- 0 -->WARP and the virtual network" },
  { message = '^(relay|ws_relay)\b', group = "<!-- 1 -->Relay" },
  { message = '^(tunnel|edge|edge_h2|quic|http2|connect|config|quick|proxy|egress|net|serve|share|demo|detach|agent|doctor|status|update|signals|exit|report|state|instances|metrics|cli|podnet|shim|resolve|verify|ports|expose|qr|autostart|origin|ingress)\b', group = "<!-- 2 -->Tunnel and commands" },
  { message = '^(docs|README|SECURITY|CLAUDE|man|maintenance)\b', group = "<!-- 3 -->Documents" },
  { message = '^(ci|live|release|deny|secrets|scripts|install\.sh|tests|fmt|clippy|deps|cargo|cliff|podnet-netns)\b', group = "<!-- 4 -->Build, tests and CI" },
  { message = '.', group = "<!-- 5 -->Other" },
]
filter_commits = false
tag_pattern = 'v[0-9].*'
sort_commits = "oldest"
