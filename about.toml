# cargo-about: the licenses of the crates in a release binary of cfrs, with
# their texts, for THIRD-PARTY-LICENSES.md (the job notes of
# .github/workflows/release.yml, with about.hbs).
accepted = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# The binary's graph only: a crate of the tests ships in no binary.
ignore-dev-dependencies = true
# The targets of the release binaries: a crate of another platform only
# (for example of Windows) ships in no binary.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "i686-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
]
