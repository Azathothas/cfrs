# cargo-deny: the advisories, licenses, duplicate versions and sources of the
# dependencies. CI runs it (.github/workflows/deny.yml). To run it by hand:
#
#   cargo deny --locked check advisories licenses bans sources

[graph]
all-features = false
# The targets of the release binaries. A crate that only another target
# compiles is in no release, and is not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "i686-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory has its reason and the date it was read.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The same list as about.toml. LGPL and GPL are not allowed: the release
# binaries are static.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace are paths, not releases.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
