[package]
name = "cfrs"
version.workspace = true
edition = "2021"
rust-version = "1.89"
license = "0BSD"
build = "build.rs"
description = "Cloudflare quick and named tunnels, and the Cloudflare WARP client, in one Rust binary for hosts with strong network limits."
repository = "https://github.com/Azathothas/cfrs"
readme = "README.md"
keywords = ["cloudflare", "tunnel", "trycloudflare", "quic", "reverse-proxy"]
categories = ["network-programming", "command-line-utilities"]

[workspace]
members = [".", "crates/pod-netns"]
exclude = ["fuzz"]
default-members = [".", "crates/pod-netns"]

[workspace.package]
version = "0.3.0-beta.2"

[lib]
name = "cfrs"
path = "src/lib.rs"

[[bin]]
name = "cfrs"
path = "src/main.rs"

[dependencies]
pod-netns = { path = "crates/pod-netns", version = "0.3.0-beta.2" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
futures = "0.3"
getrandom = "0.3"
h2 = "0.4"
httparse = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
quinn = "0.11"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
ring = "0.17"
russh = { version = "0.64", default-features = false, features = ["ring"] }
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "system-config",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
smoltcp = { version = "=0.11.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
