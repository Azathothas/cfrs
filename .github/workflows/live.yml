name: live

# cfrs against the real Cloudflare edge and WARP, on each push to main, each
# day, and by hand. No pull request runs it. The public log holds no tunnel
# host and no WARP device id: scripts/live-run.sh masks them. After two
# failed runs in a row, the job report opens one issue, and no second one
# while that issue is open.
#
# Inputs of a run by hand: plant=fail makes the run fail at once, to test
# the report; dry_run=true (and each plant) only prints what the report
# would do.

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      plant:
        description: "fail: make this run fail, to test the report"
        required: false
        default: ""
      dry_run:
        description: "true: the report changes nothing"
        required: false
        default: "false"

permissions:
  contents: read

# A planted run has its own group, so that it does not wait for (or cancel)
# a real run.
concurrency:
  group: ${{ inputs.plant != '' && format('live-plant-{0}', github.run_id) || 'live' }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  RUST_LOG: cfrs=info

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: A planted failure
        if: inputs.plant == 'fail'
        timeout-minutes: 1
        run: |
          echo "plant=fail: this run fails on purpose"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ::add-mask:: commands of scripts/live-run.sh are on its stdout.
      - name: No step drops the masks
        timeout-minutes: 1
        run: |
          if grep -nE 'live-run\.sh .*>[ ]*/dev/null' .github/workflows/live.yml; then
            echo "a step sends the output of live-run.sh to /dev/null: the masks are lost"
            exit 1
          fi
      - name: Toolchain
        timeout-minutes: 5
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        timeout-minutes: 20
        run: cargo build --locked --release --bin cfrs
      # The edge facts of docs/protocol.md section 6 (issue 14).
      - name: Edge facts
        timeout-minutes: 4
        run: sh tools/edge-facts.sh
      # cfrs doctor (issue 11): on the runner each leg can work.
      - name: cfrs doctor
        timeout-minutes: 3
        run: |
          set -eu
          target/release/cfrs doctor
          target/release/cfrs doctor --json > doctor.json
          for leg in quic http2 quic+warp; do
            jq -e --arg leg "$leg" '.legs[] | select(.leg == $leg) | .verdict == "ok"' doctor.json
          done
      - name: Quick tunnel, QUIC (UDP 7844)
        timeout-minutes: 4
        run: sh scripts/live-run.sh quic target/release/cfrs demo --exit-on-verify --protocol quic --transport direct
      - name: Quick tunnel, HTTP/2 (TCP 7844)
        timeout-minutes: 4
        run: sh scripts/live-run.sh h2 target/release/cfrs demo --exit-on-verify --protocol http2 --transport direct
      - name: Quick tunnel, JSON lines (--json)
        timeout-minutes: 4
        run: |
          set -eu
          sh scripts/live-run.sh json target/release/cfrs demo --exit-on-verify --json
          jq -e 'select(.event == "ready") | .url | test("^https://.*\\.trycloudflare\\.com$")' json.out
          jq -e 'select(.event == "ready") | .leg | test("^(quic|http2|quic\\+warp|http2\\+relay)$")' json.out
          jq -e 'select(.event == "verified") | .url | test("trycloudflare")' json.out
          # Issue 94: the resolver step that resolves the new name.
          jq -r 'select(.event == "verified") | "verified dns=\(.dns)"' json.out
          jq -e 'select(.event == "verified") | .dns | test("^(system|doh|pin|none)$")' json.out
      # Issue 101: a SIGTERM right after the ready line, during the verify
      # of the public URL, is a clean stop (exit 0), not exit 143.
      - name: SIGTERM between the ready line and the verify
        timeout-minutes: 3
        run: |
          set -eu
          target/release/cfrs tunnel --hello-world --run-for 60 --json > sig.out 2> sig.err &
          pid=$!
          i=0
          until grep -q '"event":"ready"' sig.out; do
            i=$((i + 1)); [ "$i" -lt 600 ] || { echo "no ready line"; exit 1; }
            sleep 0.1
          done
          kill -TERM "$pid"
          rc=0; wait "$pid" || rc=$?
          echo "exit $rc"
          grep -c '"event":"verified"' sig.out || true
          test "$rc" = 0
          grep 'SIGTERM: stopping' sig.err
      # --detach (issues 70-72): the start returns with the ready document,
      # the URL answers, the instance outlives the shell, and stop ends it.
      - name: Quick tunnel with --detach, ps, logs and stop
        timeout-minutes: 4
        run: |
          set -eu
          export CFRS_RUN_DIR="$RUNNER_TEMP/run"
          sh scripts/live-run.sh detach timeout 120 target/release/cfrs tunnel --hello-world --detach --name live
          url=$(tail -1 detach.out | jq -r .url)
          pid=$(tail -1 detach.out | jq -r .pid)
          test "$(tail -1 detach.out | jq -r .verified)" = true
          curl -fsS "$url" | grep -q 'Hello, world'
          target/release/cfrs ps --json | jq -e '.instances[] | select(.name == "live") | .state == "ready"'
          kill -0 "$pid"
          target/release/cfrs logs live -n 5 > /dev/null
          target/release/cfrs stop live
          ! kill -0 "$pid" 2> /dev/null
          target/release/cfrs ps --json | jq -e '.instances | length == 0'
      # UDP 7844 dropped: --protocol auto registers over HTTP/2 after the
      # stagger, and the log names the leg that won.
      - name: Quick tunnel with UDP 7844 dropped (HTTP/2 fallback)
        timeout-minutes: 4
        run: |
          set -eu
          sudo iptables -I OUTPUT -p udp --dport 7844 -j DROP
          sh scripts/live-run.sh udpdrop target/release/cfrs demo --exit-on-verify
          grep 'the leg won the race' udpdrop.err
          grep -q 'leg=http2' udpdrop.err
      - name: Remove the UDP rule
        if: always()
        timeout-minutes: 1
        run: sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP || true
      # The UDP probe (issue 12): the edge answers it; a REJECT rule makes it
      # refused, and then --protocol auto does not try QUIC on UDP 7844.
      - name: UDP probe, answered and refused
        timeout-minutes: 4
        run: |
          set -eu
          target/release/cfrs net doctor | tee doctor.out
          grep -E '^UDP egress .* OK +answered' doctor.out
          sudo iptables -I OUTPUT -p udp --dport 7844 -j REJECT
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j REJECT' EXIT
          target/release/cfrs net doctor | grep -E '^UDP egress .* FAIL +refused'
          sh scripts/live-run.sh udpreject target/release/cfrs demo --exit-on-verify
          grep 'the UDP probe was refused' udpreject.err
          grep -q 'leg=http2' udpreject.err
      # Each connection of cfrs goes through a local CONNECT proxy, which
      # counts its targets.
      - name: Quick tunnel through a local CONNECT proxy
        timeout-minutes: 4
        run: |
          set -eu
          python3 -I scripts/connect-proxy.py 18080 "$RUNNER_TEMP/connect.log" &
          sleep 1
          HTTPS_PROXY=http://127.0.0.1:18080 sh scripts/live-run.sh viaproxy target/release/cfrs demo --exit-on-verify
          grep -q 'no proxy carries UDP' viaproxy.err
          sed -E 's/[a-z0-9-]+\.trycloudflare\.com/<tunnel>.trycloudflare.com/' "$RUNNER_TEMP/connect.log" | sort | uniq -c
          grep -q '^api.trycloudflare.com:443$' "$RUNNER_TEMP/connect.log"
          grep -q ':7844$' "$RUNNER_TEMP/connect.log"
          grep -q '\.trycloudflare\.com:443$' "$RUNNER_TEMP/connect.log"
      # The rate of a GET and a POST on the HTTP path, through cfrs connect,
      # and through a WebSocket client in Python (issue 51).
      - name: Throughput of the HTTP path and of a --forward WebSocket
        timeout-minutes: 15
        run: |
          set -eu
          sh scripts/retry.sh sudo python3 -m pip install -q --break-system-packages websockets || true
          sh scripts/live-throughput.sh target/release/cfrs quic 16
          sh scripts/live-throughput.sh target/release/cfrs http2 16
      # Issue 92: share uploads of 20 and 64 MiB on each leg give 200 and
      # the file; a request over --max-request gets 413; the session stays.
      - name: Large share uploads, QUIC and HTTP/2
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/live-share.sh target/release/cfrs quic "20 64"
          sh scripts/live-share.sh target/release/cfrs http2 "20 64"
      # Issue 56: a WebSocket through a --url origin, on each leg.
      - name: WebSocket through a --url origin
        timeout-minutes: 6
        run: |
          set -eu
          sh scripts/live-ws-url.sh target/release/cfrs quic
          sh scripts/live-ws-url.sh target/release/cfrs http2
      # Issue 32: 1, 4 and 16 MiB over QUIC inside WARP, and the tunnel must
      # still answer after them.
      - name: Throughput through WARP, 1 to 16 MiB
        timeout-minutes: 15
        run: sh scripts/live-throughput.sh target/release/cfrs quic "1 4 16" warp
      # No system resolver: names come from DNS over HTTPS by IP address.
      # Then with Cloudflare's DoH addresses blocked, from Google's.
      - name: Quick tunnel with no system DNS, then with 1.1.1.1 blocked
        timeout-minutes: 10
        run: |
          set -eu
          set -x
          restore() {
            sudo cp "$RUNNER_TEMP/nsswitch.conf" /etc/nsswitch.conf
            sudo rm -f /etc/resolv.conf
            sudo cp -P "$RUNNER_TEMP/resolv.conf" /etc/resolv.conf
            sudo iptables -D OUTPUT -d 1.1.1.1 -j REJECT 2> /dev/null || true
            sudo iptables -D OUTPUT -d 1.0.0.1 -j REJECT 2> /dev/null || true
            sudo systemctl unmask --runtime systemd-resolved || true
            sudo systemctl start systemd-resolved || true
          }
          sudo cp -P /etc/resolv.conf "$RUNNER_TEMP/resolv.conf"
          sudo cp /etc/nsswitch.conf "$RUNNER_TEMP/nsswitch.conf"
          trap restore EXIT
          # NSS starts systemd-resolved again on demand: mask it, and keep
          # only files and dns (the dead server below) for host names.
          sudo systemctl mask --runtime systemd-resolved
          sudo systemctl stop systemd-resolved
          sudo sed -i 's/^hosts:.*/hosts: files dns/' /etc/nsswitch.conf
          sudo rm -f /etc/resolv.conf
          echo "nameserver 192.0.2.1" | sudo tee /etc/resolv.conf > /dev/null
          if timeout 15 getent hosts api.trycloudflare.com; then echo "the system resolver still answers"; exit 1; fi
          RUST_LOG=cfrs=debug sh scripts/live-run.sh dns timeout 180 target/release/cfrs demo --exit-on-verify --protocol http2 ||
            { tail -40 dns.err; exit 1; }
          grep 'cfrs::resolve' dns.err | head -10 || true
          grep -q 'step="doh"' dns.err
          sudo iptables -A OUTPUT -d 1.1.1.1 -j REJECT
          sudo iptables -A OUTPUT -d 1.0.0.1 -j REJECT
          RUST_LOG=cfrs=debug sh scripts/live-run.sh dns2 timeout 240 target/release/cfrs demo --exit-on-verify --protocol http2 ||
            { tail -40 dns2.err; exit 1; }
          grep 'cfrs::resolve' dns2.err | head -10 || true
          grep -q 'server="https://8\.8\.' dns2.err
      - name: A wrong --resolve pin fails at the TLS name check
        timeout-minutes: 2
        run: |
          set -u
          if sh scripts/live-run.sh pin timeout 60 target/release/cfrs --resolve api.trycloudflare.com=8.8.8.8 demo --exit-on-verify; then
            echo "a wrong pin was accepted"; exit 1
          fi
          grep -E 'NotValidForName|not valid for' pin.err
      # cfrs update against the real release v0.3.0-beta.1: the signature,
      # the identity and the SHA-256 are checked, and the copy replaces
      # itself with the binary of the release.
      - name: cfrs update to v0.3.0-beta.1
        timeout-minutes: 6
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/update"
          cp target/release/cfrs "$RUNNER_TEMP/update/cfrs"
          "$RUNNER_TEMP/update/cfrs" update --check
          timeout 300 "$RUNNER_TEMP/update/cfrs" update --version v0.3.0-beta.1
          got=$("$RUNNER_TEMP/update/cfrs" --version)
          echo "$got"
          case "$got" in "cfrs 0.3.0-beta.1 (361d1d769d00041602d8e04a4860c11ca71288aa)") ;; *) exit 1 ;; esac
          # The binary before is kept as cfrs.prev. beta.1 has no --rollback,
          # so the test puts beta.1 in cfrs.prev and this build in cfrs; then
          # --rollback (no network) swaps them.
          d="$RUNNER_TEMP/update"
          cmp "$d/cfrs.prev" target/release/cfrs
          mv "$d/cfrs" "$d/cfrs.prev"
          cp target/release/cfrs "$d/cfrs"
          "$d/cfrs" update --rollback
          "$d/cfrs" --version | grep -q 'cfrs 0.3.0-beta.1 (361d1d7'
          cmp "$d/cfrs.prev" target/release/cfrs
      # cfrs autostart with a systemd user manager (issue 23): systemd starts
      # a quick tunnel, the URL answers, and no token is in the unit or in ps.
      - name: Autostart with a systemd user unit
        timeout-minutes: 5
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          i=0
          until systemctl --user show-environment > /dev/null 2>&1; do
            i=$((i + 1)); [ "$i" -lt 30 ] || { echo "no user manager"; exit 1; }; sleep 1
          done
          mkdir -p "$HOME/.local/bin"
          cp target/release/cfrs "$HOME/.local/bin/cfrs"
          cfrs=$HOME/.local/bin/cfrs
          "$cfrs" autostart add live -- tunnel --hello-world --json
          token=eyJhIjoiYWNjb3VudCIsInQiOiJ0dW5uZWwiLCJzIjoic2VjcmV0In0=
          TUNNEL_TOKEN=$token "$cfrs" autostart add secret -- status --proxy=http://u:pw@127.0.0.1:9
          i=0
          until journalctl --user -u cfrs-live -o cat 2> /dev/null | grep -q '"event":"ready"'; do
            i=$((i + 1)); [ "$i" -lt 90 ] || { systemctl --user status cfrs-live | tail -5; exit 1; }; sleep 1
          done
          url=$(journalctl --user -u cfrs-live -o cat | grep '"event":"ready"' | tail -1 | jq -r .url)
          echo "::add-mask::${url#https://}"
          i=0
          until curl -fsS --max-time 10 "$url/" | grep -q 'Hello, world'; do
            i=$((i + 1)); [ "$i" -lt 30 ] || { echo "the URL of the unit does not answer"; exit 1; }; sleep 2
          done
          echo "systemd started the quick tunnel, and its URL answers"
          systemctl --user is-active cfrs-live
          if systemctl --user cat cfrs-secret cfrs-live | grep -E "$token|pw@"; then echo "a secret is in a unit"; exit 1; fi
          if ps auxww | grep -v grep | grep -E "$token|pw@"; then echo "a secret is in ps"; exit 1; fi
          stat -c '%a %n' "$HOME"/.local/state/cfrs/autostart/*.env
          test "$(stat -c %a "$HOME/.local/state/cfrs/autostart/secret.env")" = 600
          "$cfrs" autostart remove live
          "$cfrs" autostart remove secret
          if systemctl --user cat cfrs-live > /dev/null 2>&1; then echo "the unit is still there"; exit 1; fi
          test -z "$(ls "$HOME/.local/state/cfrs/autostart")"
      - name: Quick tunnel, QUIC through WARP (TCP 443)
        timeout-minutes: 5
        run: sh scripts/live-run.sh warpleg target/release/cfrs demo --exit-on-verify --protocol quic --transport warp
      # UDP and TCP 7844 dropped with no answer: the staggered race starts
      # WARP after two 2 s steps, not after two 8 s time limits.
      - name: Quick tunnel with UDP and TCP 7844 dropped (staggered legs)
        timeout-minutes: 5
        run: |
          set -eu
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP' EXIT
          # The doctor names the legs that cannot work, and quic+warp can.
          target/release/cfrs doctor --samples 3 || true
          target/release/cfrs doctor --samples 3 --json > doctor-drop.json || true
          jq -e '.legs[] | select(.leg == "quic+warp") | .verdict == "ok"' doctor-drop.json
          jq -e '.legs[] | select(.leg == "http2") | .verdict != "ok"' doctor-drop.json
          jq -e '.legs[] | select(.leg == "quic") | .verdict != "ok"' doctor-drop.json
          sh scripts/live-run.sh race timeout 240 target/release/cfrs demo --exit-on-verify ||
            { tail -40 race.err; exit 1; }
          grep 'the leg won the race' race.err
          grep -q 'leg=quic+warp' race.err
      # The WebSocket-to-TCP relay (--transport relay): UDP and TCP 7844 are
      # dropped on the host, so the HTTP/2 leg must go in a WebSocket to the
      # relay on TCP 443. cfrs mints the relay token itself; no log has it.
      - name: Quick tunnel through the WebSocket relay (7844 dropped)
        timeout-minutes: 5
        run: |
          set -eu
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP' EXIT
          target/release/cfrs demo --check --transport relay | tee relay-check.out
          grep -q 'http2+relay' relay-check.out
          sh scripts/live-run.sh relay timeout 240 target/release/cfrs demo --exit-on-verify --transport relay ||
            { tail -40 relay.err; exit 1; }
          grep -q 'leg=http2+relay' relay.err
          grep -q 'registered over HTTP/2' relay.err
          ! grep -E 'ephm1\.' relay.out relay.err
      # Issue 88: SSH into this runner through the reverse relay: a pair, a
      # detached node for 127.0.0.1:22, and ssh with a ProxyCommand of cfrs
      # relay connect. The host key check is on (StrictHostKeyChecking=yes).
      - name: SSH through the reverse relay
        timeout-minutes: 5
        run: |
          set -eu
          command -v sshd > /dev/null || sh scripts/retry.sh sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/relay_key"
          cat "$RUNNER_TEMP/relay_key.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          export CFRS_RUN_DIR="$RUNNER_TEMP/relay-run"
          target/release/cfrs relay pair --json > pair.json
          name=$(jq -r .name pair.json)
          token=$(jq -r .connect_token pair.json)
          echo "::add-mask::$name"
          echo "::add-mask::$token"
          target/release/cfrs relay node "$name" --to 127.0.0.1:22 --detach --name relaynode | tail -1 | jq -c '{target}'
          echo "$name $(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > "$RUNNER_TEMP/relay_known"
          export CFRS_RELAY_CONNECT_TOKEN="$token"
          ssh -i "$RUNNER_TEMP/relay_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/relay_known" -o HostKeyAlias="$name" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ProxyCommand="$PWD/target/release/cfrs relay connect $name" \
            "$USER@$name" 'echo relay-ssh-ok; uname -s' | tee relayssh.out
          grep -qx relay-ssh-ok relayssh.out
          # Two sessions at the same time through the one node.
          for i in 1 2; do
            ssh -i "$RUNNER_TEMP/relay_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/relay_known" -o HostKeyAlias="$name" \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o ProxyCommand="$PWD/target/release/cfrs relay connect $name" \
              "$USER@$name" "echo parallel-$i" > "relay-$i.out" &
          done
          wait
          grep -qx parallel-1 relay-1.out
          grep -qx parallel-2 relay-2.out
          target/release/cfrs stop relaynode
          target/release/cfrs relay stop "$name"
      - name: WARP account and probe
        timeout-minutes: 4
        run: |
          set -eu
          sh scripts/live-run.sh register target/release/cfrs warp register
          sh scripts/live-run.sh status target/release/cfrs warp status
          sh scripts/live-run.sh probe timeout 120 target/release/cfrs warp probe
      # Issue 102: an unavailable path exits 69 in each command: warp tun
      # with no CAP_NET_ADMIN (no root here), and warp proxy whose only
      # listener is refused (a program holds the port).
      - name: Exit 69 for an unavailable path
        timeout-minutes: 3
        run: |
          set -eu
          ident="$HOME/.local/state/cfrs/warp.json"
          rc=0; timeout 60 target/release/cfrs warp --identity "$ident" tun 2> tun102.err || rc=$?
          echo "warp tun (no root): exit $rc"; tail -1 tun102.err
          test "$rc" = 69
          python3 -c "import socket, time; s = socket.socket(); s.bind(('127.0.0.1', 40102)); s.listen(); time.sleep(60)" &
          sleep 1
          rc=0; timeout 60 target/release/cfrs warp --identity "$ident" proxy --listen tcp://127.0.0.1:40102 2> proxy102.err || rc=$?
          echo "warp proxy (port held): exit $rc"; tail -1 proxy102.err
          test "$rc" = 69
          # Issue 106: warp up --tun with no root names its command, the
          # cause and the recovery.
          rc=0; CFRS_RUN_DIR="$RUNNER_TEMP/run106" timeout 60 target/release/cfrs warp --identity "$ident" up --tun 2> up106.err || rc=$?
          echo "warp up --tun (no root): exit $rc"; grep '^cfrs: ' up106.err | tail -5
          test "$rc" = 69
          grep -q 'cfrs warp tun --default-route --detach exited' up106.err
          grep -q 'with root: sudo cfrs warp up --tun' up106.err
          ! grep -q 'warp proxy --detach' up106.err
      # Issue 76: TCP 443 to the MASQUE front doors is dropped; the WARP
      # client falls back to the WebSocket relay, with the same pinned key.
      - name: WARP probe through the WebSocket relay (MASQUE TCP dropped)
        timeout-minutes: 4
        run: |
          set -eu
          sudo iptables -A OUTPUT -p tcp -d 162.159.198.0/24 --dport 443 -j DROP
          trap 'sudo iptables -D OUTPUT -p tcp -d 162.159.198.0/24 --dport 443 -j DROP' EXIT
          sh scripts/live-run.sh warprelay timeout 180 target/release/cfrs warp probe ||
            { tail -30 warprelay.err; exit 1; }
          grep -q 'MASQUE goes through the WebSocket relay' warprelay.err
          ! grep -E 'ephm1\.' warprelay.out warprelay.err
      # Issue 78: one warp up; later shells join it with warp env, warp
      # exec and the --persist block; warp down removes each change.
      # Issue 97: the host refuses the TCP listener of warp up (here a
      # program holds the port: EADDRINUSE). warp up starts with the unix
      # socket only; warp env names no proxy port; warp exec works.
      - name: warp up with its TCP listener refused
        timeout-minutes: 4
        run: |
          set -eu
          export CFRS_RUN_DIR="$RUNNER_TEMP/run-up97"
          ident="$HOME/.local/state/cfrs/warp.json"
          python3 -c "import socket, time; s = socket.socket(); s.bind(('127.0.0.1', 40097)); s.listen(); time.sleep(240)" &
          holder=$!
          sleep 1
          target/release/cfrs warp --identity "$ident" up --port 40097 2> up97.err | tail -1 > up97.json
          jq -e '.tcp == false' up97.json
          grep 'did not start' up97.err
          target/release/cfrs warp env > env97.txt 2> env97.err
          grep -q CFRS_WARP_SOCKET env97.txt
          ! grep -q ALL_PROXY env97.txt
          grep 'cfrs warp exec' env97.err
          target/release/cfrs warp exec -- curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
          target/release/cfrs warp down
          kill "$holder"
      - name: warp up, env, exec, --persist and down
        timeout-minutes: 5
        run: |
          set -eu
          export CFRS_RUN_DIR="$RUNNER_TEMP/run-up"
          home="$RUNNER_TEMP/home-up"
          mkdir -p "$home"
          printf 'export KEEP=1\n' > "$home/.profile"
          # The WARP device of the other steps, not a new one in $home.
          ident="$HOME/.local/state/cfrs/warp.json"
          HOME="$home" target/release/cfrs warp --identity "$ident" up --port 40100 --persist | tail -1 > up.json
          jq -e '.name == "warp" and .persist == true' up.json
          grep -q '>>> cfrs warp up >>>' "$home/.profile" "$home/.bashrc"
          (
            eval "$(target/release/cfrs warp env)"
            curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'
            # An http:// URL through HTTP_PROXY (the forward request).
            curl -fsS --max-time 30 http://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'
          )
          # A later non-interactive shell loads the env file from .profile.
          HOME="$home" sh -c '. "$HOME/.profile"; test "$HTTPS_PROXY" = http://127.0.0.1:40100'
          # warp exec: the program has no proxy variables, the pod carries it.
          target/release/cfrs warp exec -- sh -c 'test -z "${HTTPS_PROXY:-}" && curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace' | grep -q '^warp=on'
          # Issue 85: SSH to github.com with TCP 22 dropped on the host,
          # through warp nc (WARP) and through warp nc --via-relay. The
          # server answers at the key step: the SSH handshake went through.
          sudo iptables -A OUTPUT -p tcp --dport 22 -j DROP
          for nc in "warp nc" "warp nc --via-relay"; do
            out=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o ProxyCommand="$PWD/target/release/cfrs $nc %h %p" -T git@github.com 2>&1 || true)
            echo "$nc: $out" | tail -1
            echo "$out" | grep -q 'Permission denied (publickey)'
          done
          # Issue 82: the agent doctor sees SSH fail direct and work
          # through the running warp up.
          target/release/cfrs doctor --agent --json > agent.json
          jq -e '.warp_up == true' agent.json
          jq -e '.rows[] | select(.task == "git (SSH)") | .direct != "ok" and .warp == "ok"' agent.json
          jq -e '.rows[] | select(.task == "git (HTTPS)") | .warp == "ok"' agent.json
          target/release/cfrs doctor --agent
          sudo iptables -D OUTPUT -p tcp --dport 22 -j DROP
          target/release/cfrs warp ssh-config --host github.com | grep -q 'ProxyCommand .* warp nc %h %p'
          # A second warp up is the same instance.
          HOME="$home" target/release/cfrs warp --identity "$ident" up --port 40100 | tail -1 | jq -e --argjson pid "$(jq .pid up.json)" '.pid == $pid'
          # Issue 86: a bundle with one root (as of a proxy that terminates
          # TLS) in SSL_CERT_FILE: warp up names a merged bundle in the env
          # file, and curl through WARP works with it.
          awk '/BEGIN CERTIFICATE/{n++} n==1' /etc/ssl/certs/ca-certificates.crt > "$RUNNER_TEMP/one-root.pem"
          SSL_CERT_FILE="$RUNNER_TEMP/one-root.pem" HOME="$home" target/release/cfrs warp --identity "$ident" up --port 40100 > /dev/null
          grep -q "export SSL_CERT_FILE='$CFRS_RUN_DIR/warp-ca.pem'" "$CFRS_RUN_DIR/warp.env"
          test "$(grep -c 'BEGIN CERTIFICATE' "$CFRS_RUN_DIR/warp-ca.pem")" -gt 10
          (
            eval "$(target/release/cfrs warp env)"
            curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'
          )
          HOME="$home" target/release/cfrs warp down
          ! grep -q 'cfrs warp up' "$home/.profile" "$home/.bashrc"
          grep -q 'export KEEP=1' "$home/.profile"
          ! target/release/cfrs warp env
      # Issue 87: one command on a host with port 22 and the edge port 7844
      # dropped: WARP starts, a local server gets a public URL, git over
      # SSH works through WARP; agent down removes each part.
      - name: agent up and down
        timeout-minutes: 6
        run: |
          set -eu
          export CFRS_RUN_DIR="$RUNNER_TEMP/run-agent"
          home="$RUNNER_TEMP/home-agent"
          mkdir -p "$home/srv"
          echo 'served by agent up' > "$home/srv/index.html"
          python3 -m http.server 18096 --bind 127.0.0.1 --directory "$home/srv" > /dev/null 2>&1 &
          sudo iptables -A OUTPUT -p tcp --dport 22 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p tcp --dport 22 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP' EXIT
          sh scripts/live-run.sh agent timeout 300 target/release/cfrs agent up --expose 18096 ||
            { tail -30 agent.err; exit 1; }
          tail -1 agent.out > agent.json
          jq -e '.mode == "warp"' agent.json
          jq -e '.works["git (SSH)"] | index("warp") != null' agent.json
          url=$(jq -r '.exposed[0].url' agent.json)
          curl -fsS --max-time 30 "$url" | grep -q 'served by agent up'
          target/release/cfrs agent down
          target/release/cfrs ps --json | jq -e '.instances | length == 0'
      # Issue 79: the raw IP pod. The runner limits unprivileged user
      # namespaces with AppArmor: the step allows them first. In the pod:
      # HTTPS through WARP, a UDP DNS query to 1.1.1.1, a name through the
      # resolv.conf of the pod, and IPv6.
      - name: WARP run with the netns-raw backend (TCP, UDP, IPv6, no root)
        timeout-minutes: 4
        run: |
          set -eu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat > "$RUNNER_TEMP/raw-check.sh" <<'CHECK'
          set -eu
          curl -fsS --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(10)
          q = bytes.fromhex('1234010000010000000000000765786d706c6503636f6d0000010001'.replace('65786d706c65', '6578616d706c65'))
          s.sendto(q, ('1.1.1.1', 53)); a = s.recv(512)
          print('udp-dns', 'ok' if a[:2] == b'\x12\x34' else 'bad')
          "
          getent hosts example.com > /dev/null && echo 'resolv.conf ok'
          curl -fsS --max-time 20 'https://[2606:4700:4700::1111]/cdn-cgi/trace' | grep '^warp=' | sed 's/^/ipv6 /'
          CHECK
          sh scripts/live-run.sh rawrun timeout 120 target/release/cfrs warp run --backend netns-raw -- sh "$RUNNER_TEMP/raw-check.sh" ||
            { tail -20 rawrun.err; exit 1; }
          grep -q 'the program runs in a raw pod' rawrun.err
          grep -q '^warp=on' rawrun.out
          grep -q 'udp-dns ok' rawrun.out
          grep -q 'resolv.conf ok' rawrun.out
          grep -q '^ipv6 warp=on' rawrun.out
      # Issue 77: with root, the whole host through WARP. The default routes
      # are up for a few seconds only (the runner's own connections stall
      # while they are up); stop puts back each route and the resolver.
      - name: warp tun --default-route (root), then everything as before
        timeout-minutes: 4
        run: |
          set -eu
          run=/tmp/cfrs-run-root
          sudo cp /etc/resolv.conf "$RUNNER_TEMP/resolv.before"
          ip route > "$RUNNER_TEMP/routes.before"
          sudo env CFRS_RUN_DIR="$run" target/release/cfrs warp --ephemeral tun --default-route --detach --name tun | tail -1 > tun.json
          jq -e '.default_route == true' tun.json
          ip route | grep 'dev cfrs0'
          curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(10)
          s.sendto(bytes.fromhex('123401000001000000000000076578616d706c6503636f6d0000010001'), ('1.1.1.1', 53))
          print('udp-dns', 'ok' if s.recv(512)[:2] == bytes.fromhex('1234') else 'bad')
          " | grep 'udp-dns ok'
          sudo env CFRS_RUN_DIR="$run" target/release/cfrs stop tun
          sudo env CFRS_RUN_DIR="$run" target/release/cfrs logs tun | grep 'the routes and the resolver are as before'
          ! ip route | grep -q 'dev cfrs0'
          ip route | diff "$RUNNER_TEMP/routes.before" -
          sudo cmp /etc/resolv.conf "$RUNNER_TEMP/resolv.before"
      # Issue 105: warp tun --default-route on a host with no default route,
      # whose only way out is a CONNECT proxy on a connected subnet. A
      # network namespace stands for that host (the runner keeps its own
      # routes): a veth pair, no default route in the namespace, the proxy
      # on the host side of the pair.
      - name: warp tun --default-route with no default route (proxy only)
        timeout-minutes: 4
        run: |
          set -eu
          sudo ip netns add r105
          trap 'sudo ip netns del r105 2> /dev/null || true; sudo ip link del v105a 2> /dev/null || true; sudo rm -rf /etc/netns/r105' EXIT
          sudo ip link add v105a type veth peer name v105b
          sudo ip link set v105b netns r105
          sudo ip addr add 10.105.0.1/24 dev v105a
          sudo ip link set v105a up
          sudo ip netns exec r105 ip addr add 10.105.0.2/24 dev v105b
          sudo ip netns exec r105 ip link set v105b up
          sudo ip netns exec r105 ip link set lo up
          ! sudo ip netns exec r105 ip route | grep -q '^default'
          # The namespace has a resolv.conf of its own, as a host has (ip
          # netns exec mounts it on /etc/resolv.conf); the stub resolver of
          # the runner does not answer in another namespace.
          sudo mkdir -p /etc/netns/r105
          echo 'nameserver 1.1.1.1' | sudo tee /etc/netns/r105/resolv.conf > /dev/null
          python3 -I scripts/connect-proxy.py 3128 "$RUNNER_TEMP/connect105.log" 10.105.0.1 &
          sudo cp /etc/resolv.conf "$RUNNER_TEMP/resolv105.before"
          sudo ip netns exec r105 env HTTPS_PROXY=http://10.105.0.1:3128 CFRS_RUN_DIR=/tmp/cfrs-run-105 \
            timeout 120 target/release/cfrs warp --ephemeral --no-relay tun --default-route --detach --name tun105 > tun105.out
          tail -1 tun105.out > tun105.json
          jq -e '.default_route == true' tun105.json
          grep 'outside: none needed' tun105.out
          sudo ip netns exec r105 ip route | grep 'dev cfrs0'
          sudo ip netns exec r105 cat /etc/resolv.conf
          sudo ip netns exec r105 curl -fsS --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
          sudo ip netns exec r105 env CFRS_RUN_DIR=/tmp/cfrs-run-105 target/release/cfrs stop tun105
          ! sudo ip netns exec r105 ip route | grep -q 'dev cfrs0'
          sudo cmp /etc/resolv.conf "$RUNNER_TEMP/resolv105.before"
      - name: WARP run
        timeout-minutes: 3
        run: |
          set -eu
          sh scripts/live-run.sh warprun timeout 120 target/release/cfrs warp run --backend seccomp -- curl -sS https://www.cloudflare.com/cdn-cgi/trace
          grep -q '^warp=on' warprun.out
          # Issue 84: UDP of the seccomp pod goes to warp proxy as frames on
          # the unix control connection (no kernel UDP socket). NTP, not DNS:
          # the pod answers port 53 itself.
          # RUST_LOG of the job (info) has priority over -v: set debug here.
          RUST_LOG=cfrs=debug sh scripts/live-run.sh warpudp timeout 120 target/release/cfrs warp run --backend seccomp -- python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(10)
          s.sendto(b'\x1b' + bytes(47), ('162.159.200.123', 123))
          a = s.recv(512)
          print('udp-ntp', 'ok' if len(a) >= 48 and a[0] & 7 == 4 else 'bad')
          "
          grep -q 'udp-ntp ok' warpudp.out
          grep 'a UDP association in the stream' warpudp.err
      - name: WARP proxy
        timeout-minutes: 9
        run: |
          set -eu
          target/release/cfrs warp proxy --listen tcp://127.0.0.1:40000 --run-for 150 > warpproxy.log 2>&1 &
          # The proxy listens after the WARP registration: wait for it.
          i=0
          until nc -z 127.0.0.1 40000 2> /dev/null; do
            i=$((i + 1))
            if [ "$i" -gt 60 ]; then
              sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|t\.[0-9a-f-]{8,}/<id>/g' warpproxy.log | tail -30
              echo "the WARP proxy does not listen after 60 s"
              exit 1
            fi
            sleep 1
          done
          out=$(curl -sS --max-time 30 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace)
          echo "$out" | grep -E '^(warp|colo|tls)='
          echo "$out" | grep -q '^warp=on'
          # Issue 81: IPv6 through WARP: a host with AAAA records only, and
          # an IPv6 literal.
          curl -fsS --max-time 30 -o /dev/null -w 'ipv6-only host: %{http_code}\n' -x socks5h://127.0.0.1:40000 https://ipv6.google.com/
          curl -fsS --max-time 30 -x socks5h://127.0.0.1:40000 'https://[2606:4700:4700::1111]/cdn-cgi/trace' | tee v6trace.txt | grep -E '^(ip|warp)=' | sed -E 's/^ip=.*/ip=<v6 address>/'
          grep -q '^warp=on' v6trace.txt
          grep -q '^ip=.*:' v6trace.txt
          # Issue 112: a UDP datagram to IPv6 (ATYP 4) does not stop the
          # proxy. Then IPv4 UDP and a TCP CONNECT still work.
          python3 scripts/socks5-udp-dns.py 127.0.0.1 40000 '[2606:4700:4700::1111]:53' 3 || true
          python3 scripts/socks5-udp-dns.py 127.0.0.1 40000 1.1.1.1:53 3
          curl -sS --max-time 30 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
          if grep -q 'panicked' warpproxy.log; then grep -A2 'panicked' warpproxy.log; exit 1; fi
          # Issue 114: datagrams to a name (ATYP 3); at least 27 of 30 get
          # an answer.
          python3 scripts/socks5-udp-dns.py 127.0.0.1 40000 one.one.one.one:53 30 | tee atyp3.txt
          awk '{ exit !($3 >= 27) }' atyp3.txt
          # Issues 93 and 100: one TCP download of 20 MB through the
          # userspace stack and MASQUE, for each TCP window
          # (CFRS_WARP_TCP_BURST, in segments; the default is 1). Run
          # 41378673046: 1 segment gave 3.3 MB/s; 8, 32 and none stalled at
          # about 10.5 MB. A stalled run prints its last warnings. The step
          # needs 1 MB/s from the default.
          port=40200
          for burst in default 2 4 8 none; do
            port=$((port + 1))
            if [ "$burst" = default ]; then unset CFRS_WARP_TCP_BURST; else export CFRS_WARP_TCP_BURST=$burst; fi
            RUST_LOG=cfrs=debug target/release/cfrs warp proxy --listen "tcp://127.0.0.1:$port" --run-for 90 > "burst-$burst.log" 2>&1 &
            bp=$!
            i=0
            until nc -z 127.0.0.1 "$port" 2> /dev/null; do
              i=$((i + 1)); [ "$i" -lt 60 ] || break
              sleep 1
            done
            rate=$(curl -sS --max-time 45 -o /dev/null -w '%{speed_download} %{size_download}' -x "socks5h://127.0.0.1:$port" \
              'https://speed.cloudflare.com/__down?bytes=20000000' || true)
            echo "warp proxy download, TCP window ${burst}: ${rate:-none} (bytes/s, bytes)"
            case "$rate" in
              *" 20000000") ;;
              *) grep -E 'WARN|ERROR|closed|dead|stall|capacity' "burst-$burst.log" | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<id>/g' | tail -8 ;;
            esac
            kill "$bp" 2> /dev/null || true
            wait "$bp" 2> /dev/null || true
            if [ "$burst" = default ]; then default=${rate%% *}; fi
          done
          unset CFRS_WARP_TCP_BURST
          awk -v r="${default:-0}" 'BEGIN { exit !(r >= 1000000) }'
          # Issue 75: the MASQUE connection is killed (ss -K); the proxy
          # opens a new session, and a new client goes through it.
          sudo ss -K dst 162.159.198.0/24 dport = 443 || true
          # Run 41552624692: on some runner kernels ss -K fails ("RTNETLINK
          # answers: Invalid argument") and the connection stays. Then a
          # TCP reset rule closes it, until the proxy sees the dead session.
          if ss -Htn state established dst 162.159.198.0/24 dport = 443 | grep -q .; then
            echo "ss -K did not close the MASQUE connection; a TCP reset rule closes it"
            rule="OUTPUT -d 162.159.198.0/24 -p tcp --dport 443 -j REJECT --reject-with tcp-reset"
            sudo iptables -I $rule
            i=0
            until grep -qE 'MASQUE (send|receive) loop ended|the MASQUE session is dead|WARP session is closed' warpproxy.log; do
              i=$((i + 1)); [ "$i" -lt 45 ] || break
              sleep 1
            done
            sudo iptables -D $rule
          fi
          i=0
          until grep -q 'a new WARP session is open' warpproxy.log; do
            i=$((i + 1))
            if [ "$i" -gt 60 ]; then
              sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|t\.[0-9a-f-]{8,}/<id>/g' warpproxy.log | tail -30
              echo "no new WARP session after 60 s"
              exit 1
            fi
            sleep 1
          done
          curl -sS --max-time 30 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'
          grep 'a new WARP session is open' warpproxy.log
      # The test box (issue 21): a user whose only egress is a policy proxy.
      - name: The test box
        timeout-minutes: 15
        run: sh scripts/test_in_box.sh target/release/cfrs
      - name: The test box fails with a binary that exits 3
        timeout-minutes: 3
        run: |
          if BOX_PLANT=exit3 sh scripts/test_in_box.sh target/release/cfrs; then
            echo "the box passed a planted binary"; exit 1
          fi
      - name: Remove the WARP device
        if: always()
        timeout-minutes: 2
        run: |
          if [ -x target/release/cfrs ]; then
            sh scripts/live-run.sh delete target/release/cfrs warp delete && echo "the WARP device is deleted" || echo "cfrs warp delete failed"
          fi

  # After two failed runs in a row, open one issue. Do not open a second one
  # while that issue is open.
  report:
    needs: live
    if: always() && (needs.live.result == 'failure' || inputs.plant == 'fail')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run == 'true' || inputs.plant != '' }}
      PLANT: ${{ inputs.plant }}
      TITLE: "live: two runs in a row failed"
    steps:
      - name: Open one issue after two failed runs
        run: |
          set -eu
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?branch=main&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].conclusion // \"none\"")
          echo "the run before this one: $previous"
          if [ "$PLANT" = fail ]; then previous=failure; fi
          if [ "$previous" != failure ]; then
            echo "one failed run; no issue yet"
            exit 0
          fi
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "an open issue has the title \"$TITLE\"; no second issue"
            exit 0
          fi
          body="The workflow live failed in two runs in a row. The last run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: the report would open the issue \"$TITLE\": $body"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
