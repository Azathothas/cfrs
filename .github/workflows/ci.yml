name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: The man page renders with groff and mandoc
        run: |
          set -eu
          sudo apt-get install -y -qq groff mandoc > /dev/null
          cargo run -q --bin cfrs -- man --roff > cfrs.1
          groff -man -Tutf8 -ww -z cfrs.1 2> groff.log || true
          if [ -s groff.log ]; then cat groff.log; exit 1; fi
          mandoc -T lint -W error cfrs.1
          mandoc -T utf8 cfrs.1 | head -20

  # Run each edge leg against the real Cloudflare edge, and fetch the public
  # URL. Also run the WARP client.
  live:
    runs-on: ubuntu-latest
    needs: test
    env:
      RUST_LOG: cfrs=info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --bin cfrs
      - name: Quick tunnel, QUIC (UDP 7844)
        run: timeout 180 target/release/cfrs demo --exit-on-verify --protocol quic --transport direct
      - name: Quick tunnel, HTTP/2 (TCP 7844)
        run: timeout 180 target/release/cfrs demo --exit-on-verify --protocol http2 --transport direct
      - name: Quick tunnel, JSON lines (--json)
        run: |
          set -eu
          timeout 180 target/release/cfrs demo --exit-on-verify --json > demo.jsonl
          cat demo.jsonl
          jq -e 'select(.event == "ready") | .url | test("^https://.*\\.trycloudflare\\.com$")' demo.jsonl
          jq -e 'select(.event == "verified") | .url | test("trycloudflare")' demo.jsonl
      - name: Quick tunnel, QUIC through WARP (TCP 443)
        run: timeout 240 target/release/cfrs demo --exit-on-verify --protocol quic --transport warp
      - name: WARP account and probe
        run: |
          target/release/cfrs warp register
          target/release/cfrs warp status
          timeout 120 target/release/cfrs warp probe
      - name: WARP run
        run: |
          out=$(timeout 120 target/release/cfrs warp run --backend seccomp -- curl -sS https://www.cloudflare.com/cdn-cgi/trace)
          echo "$out"
          echo "$out" | grep -q '^warp=on'
      - name: WARP proxy
        run: |
          target/release/cfrs warp proxy --listen tcp://127.0.0.1:40000 --run-for 60 &
          sleep 15
          out=$(curl -sS --max-time 30 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace)
          echo "$out"
          echo "$out" | grep -q '^warp=on'
      - name: Remove the WARP device
        if: always()
        run: target/release/cfrs warp delete || true

  static:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the C cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld musl-tools gcc-aarch64-linux-gnu
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: clang
          CC_aarch64_unknown_linux_musl: clang
          CFLAGS_aarch64_unknown_linux_musl: --target=aarch64-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          for bin in cfrs pod-netns; do
            cp target/${{ matrix.target }}/release/$bin dist/$bin-${{ matrix.target }}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cfrs-${{ matrix.target }}
          path: dist/*
